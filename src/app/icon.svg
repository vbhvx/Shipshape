<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Monochrome Dark Gradient matching the theme -->
    <linearGradient id="squircle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Subtle Silver Metallic Border -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Drop Shadow for crisp typography -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base matching the attached screenshot geometry -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#squircle-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Centered Bold White Letter S from the attached screenshot -->
  <text
    x="32"
    y="33.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="37"
    fill="#ffffff"
    letter-spacing="-0.5"
    filter="url(#shadow)"
  >S</text>
</svg>
