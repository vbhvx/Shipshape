<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Indigo/Violet bottom-left to Electric Blue & Cyan top-right -->
    <linearGradient id="shipshape-squircle-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="25%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Top-Right Specular Glow -->
    <radialGradient id="specular-glow" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#shipshape-squircle-grad)" />

  <!-- Top-Right Ambient Glow Overlay -->
  <rect width="64" height="64" rx="18" fill="url(#specular-glow)" />

  <!-- Center Letter 'S' in Crisp Bold White -->
  <text
    x="32"
    y="44.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="37"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-0.5px"
    filter="url(#shadow)"
  >S</text>
</svg>
