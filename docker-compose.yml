# Full local production-like stack: PostgreSQL + migrations + the app.
#   cp .env.example .env    # fill in the Clerk keys
#   docker compose up --build
# The app is then served at http://localhost:3000 (readiness: /api/ready).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipshape
      POSTGRES_PASSWORD: shipshape
      POSTGRES_DB: shipshape
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipshape"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DIRECT_URL: postgresql://shipshape:shipshape@postgres:5432/shipshape
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    environment:
      DATABASE_URL: postgresql://shipshape:shipshape@postgres:5432/shipshape
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
